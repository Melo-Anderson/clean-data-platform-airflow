# docker-compose.prod.override.yml
# Simulates production-like CeleryExecutor configuration locally.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.override.yml up

x-airflow-prod: &airflow-prod-env
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow

services:
  airflow-webserver:
    environment:
      <<: *airflow-prod-env
  airflow-scheduler:
    environment:
      <<: *airflow-prod-env
  airflow-worker:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.0.0-python3.12}
    environment:
      <<: *airflow-prod-env
    command: celery worker
    profiles:
      - airflow-prod
  redis:
    image: redis:7-alpine
    profiles:
      - airflow-prod
    ports:
      - "6379:6379"
